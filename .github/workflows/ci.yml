name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run env:init
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: docker compose config --quiet
      - run: docker compose up -d --wait postgres rabbitmq mailpit influxdb
      - run: npm run test:integration
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: npm run test:smoke
      - run: docker compose up -d --no-deps --force-recreate --wait backend license-service notification-worker
      - run: node scripts/wait-ready.mjs
      - run: npm run test:smoke
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down
